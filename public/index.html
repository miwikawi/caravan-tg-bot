<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Караван Coca-Cola</title>
<meta property="og:title" content="Караван Coca-Cola"><meta property="og:description" content="Два концепта мини-приложения"><meta property="og:image" content="img/truck-hero.jpg">
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<style>
/* One connected canvas: 1 user phone (bot → mini-app) with the control desk · 2 moderator mini-app + LED manager on the truck PC · 3 the approved truck with its 4 LED screens. Bayram/Caravan DS: red and white, Better With + TCCC Unity, pill buttons, 1:1 photos. */
@font-face{font-family:"Better With";src:url(fonts/BetterWith.woff2) format("woff2");font-display:swap}
@font-face{font-family:"TCCC Unity";src:url(fonts/TCCCUnity-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"TCCC Unity";src:url(fonts/TCCCUnity-Medium.woff2) format("woff2");font-weight:500 800;font-display:swap}
:root{
  --red:#e41e2b; --red6:#d11b27; --red8:#a61019; --paper:#fff; --g2:#d1d3d4; --g1:#f2f2f2; --ink:#1a1a1a; --muted:#5c5552; --ok:#1f7a44; --night:#0f1a33;
  --sh-tile:0 6px 0 #a61019,0 12px 24px rgba(80,0,8,.35); --sh-card:0 2px 6px rgba(26,26,26,.06),0 10px 24px rgba(26,26,26,.08);
  --stage:#170c0e; --desk:#241316; --deskline:#3e2327; --dtext:#f6ecec; --dmuted:#bfa5a8;
  --tg1:#cfe3a8; --tg2:#9cc98b; --tg3:#7db487; --tgbtn:rgba(78,140,72,.78); --tgink:#0f2a12;
  --win:#16181d; --win2:#1e2128; --win3:#272b34; --winline:#333845; --wintext:#e9ecf2; --winmuted:#8d94a3; --accent:#4c9dff;
  --display:"Better With",Georgia,serif; --ui:"TCCC Unity","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.25,.8,.25,1); --sheet:cubic-bezier(.32,.72,0,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--stage);color:var(--dtext);font-family:var(--ui);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible{outline:3px solid #ffd2d5;outline-offset:2px}
img{display:block;max-width:100%}
.page{max-width:1320px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:34px}

/* header + pipeline */
.top{display:grid;gap:14px}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,4.6vw,56px);line-height:.95;text-wrap:balance}
.top p{margin:0;color:var(--dmuted);max-width:78ch}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pipe button{border:1px solid var(--deskline);background:var(--desk);border-radius:999px;padding:8px 14px 8px 8px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:13.5px;transition:background .3s,border-color .3s}
.pipe button i{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-size:12px;display:grid;place-items:center}
.pipe button.hot{border-color:#ff8b94;background:#3a1519;animation:hot 1s ease-out 2}
@keyframes hot{50%{box-shadow:0 0 0 6px rgba(228,30,43,.35)}}
.pipe .ar{color:var(--dmuted)}
.sech{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dmuted)}
.sech b{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px;letter-spacing:0}
.sech span{flex:1}
.row1{display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:start}
.row2{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:960px){.row1,.row2{grid-template-columns:minmax(0,1fr);justify-items:center}.row1>*,.row2>*{width:100%}.row1 .phone,.row2 .mphone{justify-self:center}}

/* ---------- user phone ---------- */
.phone{width:min(390px,calc(100vw - 32px));height:820px;border:11px solid #0e0a0b;border-radius:52px;background:#000;position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5);isolation:isolate}
.status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-weight:600;font-size:14px;flex:none}
.tg{position:absolute;inset:0;display:flex;flex-direction:column;color:var(--tgink);background:linear-gradient(165deg,var(--tg1),var(--tg2) 55%,var(--tg3))}
.tg .status{color:#111}
.tghead{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:6px;padding:4px 12px 8px;flex:none}
.pillb{height:46px;border-radius:23px;background:rgba(255,255,255,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;gap:4px;font-weight:600}
.pillb .n{background:#111;color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.tgtitle{flex-direction:column;gap:0;line-height:1.15}
.tgtitle b{font-size:15.5px}.tgtitle small{font-size:12px;color:#425a3c}
.ava{width:46px;height:46px;border-radius:50%;justify-self:end;overflow:hidden;border:2px solid #fff}
.ava img{width:100%;height:100%}
.chat{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 10px 12px;display:flex;flex-direction:column;gap:6px}
.chat::-webkit-scrollbar{display:none}
.chat .spacer{flex:1}
.msg{max-width:80%;background:#fff;border-radius:16px 16px 16px 6px;padding:8px 11px;font-size:14.5px;box-shadow:0 1px 1px rgba(0,0,0,.08);animation:fin .35s ease-out}
.msg small{font-size:11px;color:#8b948a;margin-left:8px;float:right;margin-top:5px}
.msg.me{align-self:flex-end;background:#e2f7cb;border-radius:16px 16px 6px 16px}
.msg.pic{padding:4px;width:72%}
.msg.pic img{border-radius:12px;width:100%;aspect-ratio:1;object-fit:cover}
.msg.pic p{margin:6px 6px 2px;font-size:14px}
.hubpic{width:82%;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12);position:relative;background:#e41e2b}
.hubpic small{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;border-radius:9px;padding:2px 7px}
.kb{width:82%;display:grid;gap:4px}
.kbtn{border:0;border-radius:12px;background:var(--tgbtn);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-weight:600;font-size:15px;padding:12px 10px;position:relative;text-align:center;transition:transform .1s ease-out}
.kbtn:active{transform:scale(.98)}
.kbtn::after{content:"";position:absolute;right:8px;top:8px;width:8px;height:8px;border:1.6px solid rgba(255,255,255,.9);border-radius:2px}
.kbtn.noapp::after{display:none}
.kbtn.cara{background:var(--red);box-shadow:0 4px 14px rgba(166,16,25,.35)}
.datep{align-self:center;background:rgba(60,100,50,.35);color:#fff;font-size:12.5px;border-radius:10px;padding:2px 9px;font-weight:600}
.tginput{display:flex;gap:8px;align-items:center;padding:6px 10px 22px;flex:none}
.tginput span{flex:1;height:42px;border-radius:21px;background:rgba(255,255,255,.7);display:flex;align-items:center;padding:0 16px;color:#88908a}
.tginput i{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.7)}
@keyframes fin{from{opacity:0;transform:translateY(8px)}}

/* mini-app shell */
.mini{position:absolute;inset:0;z-index:5;background:var(--g1);color:var(--ink);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .45s var(--sheet)}
.mini.on{transform:none}
.mini>.status{background:var(--red);color:#fff}
.mbar{height:46px;display:grid;grid-template-columns:80px 1fr 80px;align-items:center;flex:none;padding:0 12px;background:var(--red);color:#fff;position:relative;z-index:3}
.mbar .l{border:0;background:none;font-size:14.5px;text-align:left;padding:0}
.mbar .t{text-align:center;line-height:1.1}.mbar .t b{display:block;font-size:15px;font-weight:500}.mbar .t small{font-size:11px;opacity:.85}
.mbar .r{justify-self:end;font-size:20px;letter-spacing:1px;opacity:.9}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}
.scroll.redbg{background:var(--red)}
.toast{position:absolute;left:16px;right:16px;bottom:30px;background:rgba(26,26,26,.92);color:#fff;border-radius:14px;padding:11px 14px;font-size:13px;z-index:20;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* shared light UI */
.scr{padding:14px 16px 40px;display:grid;gap:12px;align-content:start;min-height:100%}
.card{background:#fff;border-radius:16px;box-shadow:var(--sh-card);padding:16px;display:grid;gap:10px}
.h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0;color:var(--red);text-wrap:balance}
.h2{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1;margin:0}
.sub{font-size:14px;color:var(--muted);margin:0}
.cap{font-size:13px;color:var(--muted)}
.lbl{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:14px 18px;font:500 16px var(--ui);width:100%;display:flex;justify-content:center;align-items:center;gap:8px;transition:transform .1s ease-out,opacity .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn.r{background:var(--red);color:#fff}.btn.r:hover{background:var(--red6)}
.btn.w{background:#fff;color:var(--red)}
.btn.s{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1.5px var(--g2)}
.btn.o{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.btn[disabled]{opacity:.4;pointer-events:none}
.back{border:0;background:#fff;box-shadow:var(--sh-card);border-radius:999px;padding:8px 14px;font-weight:500;font-size:13.5px;justify-self:start;color:var(--red)}
.coin{width:18px;height:18px;object-fit:contain;flex:none;display:inline-block;vertical-align:-4px}
.bal{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--red);border-radius:999px;padding:5px 12px 5px 6px;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:var(--sh-card)}
.bal .coin{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:500;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase}
.chip.live{background:var(--red);color:#fff}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.2s ease-in-out infinite}
.chip.today{background:var(--red);color:#fff}
.chip.soon{background:#fde8e9;color:var(--red8)}
.chip.done{background:var(--g1);color:var(--muted)}
@keyframes pulse{50%{opacity:.3}}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* intro */
.intro{position:absolute;inset:0;z-index:9;overflow:hidden;cursor:pointer;background:#0b0507;transition:opacity .45s ease}
.intro.out{opacity:0;pointer-events:none}
.intro .ph{position:absolute;inset:0;background:url(img/truck-hero.webp) 64% 50%/cover;opacity:0}
.intro.play .ph{animation:ihz 2.8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes ihz{0%{opacity:0;transform:scale(1.3)}18%{opacity:1}100%{opacity:1;transform:scale(1.04)}}
.intro .shade{position:absolute;inset:0;background:linear-gradient(rgba(10,0,2,.15),transparent 30%,rgba(10,0,2,.7))}
.intro .cur{position:absolute;inset:0;background:radial-gradient(100% 60% at 50% 60%,#f0333f,#e41e2b 50%,#a61019);clip-path:circle(0% at 50% 66%)}
.intro.play .cur{animation:cur .9s cubic-bezier(.65,0,.25,1) 2.3s forwards}
@keyframes cur{to{clip-path:circle(150% at 50% 66%)}}
.intro .stripes{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 12px,transparent 12px 32px);-webkit-mask-image:linear-gradient(transparent 45%,#000);mask-image:linear-gradient(transparent 45%,#000);opacity:0}
.intro.play .stripes{animation:fade .6s ease 3s forwards}
.gbox{position:absolute;left:50%;width:330px;height:330px;margin-left:-165px}
.gbox img{position:absolute;inset:0;width:100%;height:100%}
.intro .gbox{top:250px;width:420px;height:420px;margin-left:-210px;opacity:0;transform:translateY(60px) scale(.6)}
.intro.play .gbox{animation:bxin .7s cubic-bezier(.3,1.5,.5,1) 2.8s forwards,shake .45s ease-in-out 3.55s 1}
@keyframes bxin{to{opacity:1;transform:none}}
@keyframes shake{20%{transform:rotate(-4deg)}45%{transform:rotate(4deg)}70%{transform:rotate(-2deg)}100%{transform:none}}
.gbox .gl,.gbox .bm{opacity:0}
.gbox .lc{transform-origin:50% 58%}
@keyframes lidoff{0%{transform:none;opacity:1}25%{transform:translateY(-6%) rotate(-5deg);opacity:1}100%{transform:translate(42%,-95%) rotate(40deg);opacity:0}}
.gbox .spk{position:absolute;left:50%;top:59%;width:9px;height:9px;margin:-4px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 10px 2px rgba(255,255,255,.8)}
@keyframes spk{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
.intro.play .gbox .lc{animation:lidoff .85s cubic-bezier(.3,.6,.35,1) 4s forwards}
.intro.play .gbox .gl,.intro.play .gbox .bm{animation:fade .4s ease 4.05s forwards}
.intro.play .gbox .spk{animation:spk .9s ease-out calc(4.1s + var(--d)) forwards}
@keyframes hide{to{opacity:0}}
@keyframes lidpop{from{opacity:1;transform:translateY(30px) rotate(6deg)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.ititle{position:absolute;left:0;right:0;top:96px;display:grid;justify-items:center;gap:8px;text-align:center;color:#fff;opacity:0;transform:translateY(52vh) scale(.12);z-index:2}
.intro.play .ititle{animation:rise 1s cubic-bezier(.2,.9,.25,1.05) 4.15s forwards}
@keyframes rise{0%{opacity:0;transform:translateY(52vh) scale(.12)}15%{opacity:1}100%{opacity:1;transform:none}}
@keyframes tin{to{opacity:1;transform:none}}
.ititle img{width:190px}
.ititle h1{margin:0;font-family:var(--display);font-weight:400;font-size:46px;line-height:.95}
.ititle p{margin:4px 0 0;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;opacity:.92}
.intro .skip{position:absolute;right:16px;top:52px;font-size:12.5px;font-weight:500;color:#fff;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;z-index:3}
.flake{position:absolute;top:-10px;color:rgba(255,255,255,.9);animation:fall linear infinite;pointer-events:none;z-index:2}
@keyframes fall{to{transform:translateY(840px) translateX(var(--dx))}}

/* consent */
.cons{min-height:100%;display:grid;align-content:start;background:var(--red);color:#fff}
.cons .hero{position:relative;aspect-ratio:4/3.1;overflow:hidden}
.cons .hero img{width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.cons .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(228,30,43,0) 40%,var(--red))}
.cons .hero div{position:absolute;left:18px;right:18px;bottom:6px;z-index:1;display:grid;gap:6px}
.cons .hero div img{width:130px;height:auto}
.cons .hero b{font-family:var(--display);font-weight:400;font-size:38px;line-height:.95}
.cons .body{padding:6px 16px 28px;display:grid;gap:10px}
.chk{display:flex;gap:12px;align-items:flex-start;border:0;background:#fff;border-radius:16px;padding:14px;text-align:left;color:var(--ink);font-size:14px;line-height:1.4}
.chk .b{width:24px;height:24px;border-radius:8px;border:2px solid var(--g2);display:grid;place-items:center;flex:none;background:#fff}
.chk[aria-checked="true"] .b{background:var(--red);border-color:var(--red)}
.chk[aria-checked="true"] .b::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk u{color:var(--red);text-decoration:none;font-weight:500;white-space:nowrap}
.cons .btn{margin-top:6px}

/* welcome bonus */
.wel{position:absolute;inset:0;z-index:8;background:radial-gradient(100% 70% at 50% 45%,#f0333f,#e41e2b 55%,#a61019);color:#fff;display:grid;align-content:center;justify-items:center;text-align:center;padding:24px;gap:6px;opacity:0;pointer-events:none;transition:opacity .35s}
.wel.on{opacity:1;pointer-events:auto}
.wel .stage{position:relative;width:330px;height:300px}
.wel .gbox{top:-10px}
.wel.on .gbox{animation:shake .45s ease-in-out .35s 1}
.wel.on .gbox .lc{animation:lidoff .8s cubic-bezier(.3,.6,.35,1) .85s forwards}
.wel.on .gbox .gl,.wel.on .gbox .bm{animation:fade .4s ease .9s forwards}
.wel.on .gbox .spk{animation:spk .9s ease-out calc(1s + var(--d)) forwards}
.gbox .coinfly{position:absolute;inset:auto;left:50%;top:50%;width:34%;height:auto;margin-left:-17%;opacity:0;transform:translateY(5%) scale(.5)}
.wel.on .gbox .coinfly{animation:coin 1s cubic-bezier(.25,1.35,.45,1) 1s forwards,bob 2.4s ease-in-out 2s infinite}
@keyframes coin{0%{opacity:0;transform:translateY(5%) scale(.5)}20%{opacity:1}100%{opacity:1;transform:translateY(-118%) scale(1.15)}}
@keyframes bob{0%,100%{transform:translateY(-118%) scale(1.15)}50%{transform:translateY(-128%) scale(1.15)}}
.wel .tx{opacity:0;transform:translateY(12px);display:grid;gap:6px;justify-items:center}
.wel.on .tx{animation:tin .6s var(--ease) 1.7s forwards}
.wel .big{font-family:var(--display);font-size:64px;line-height:.9}
.wel .tx p{margin:0;font-size:15px;max-width:30ch}
.wel .btn{margin-top:14px;width:240px}

/* concept 1: tiles */
.tilescr{background:var(--red);color:#fff;min-height:100%}
.tilescr .toprow h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;line-height:1}
.metro{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:66px;gap:12px;padding-bottom:10px}
.tile{border:0;padding:0;position:relative;overflow:hidden;text-align:left;border-radius:16px;box-shadow:var(--sh-tile);transition:transform .15s ease-out,box-shadow .15s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #a61019,0 6px 12px rgba(80,0,8,.3)}
.t-ai{grid-column:span 4;grid-row:span 4}
.t-route{grid-column:span 2;grid-row:span 3}
.t-bus{grid-column:span 2;grid-row:span 3}
.t-vote{grid-column:span 4;grid-row:span 2}
.t-trk{grid-column:span 2;grid-row:span 2}
.t-bay{grid-column:span 2;grid-row:span 2}
.tile .tl{position:absolute;left:12px;right:12px;bottom:10px;display:grid;gap:2px;z-index:3}
.tile .tl b{font-size:17px;font-weight:500;line-height:1.1}
.tile .tl small{font-size:12px;opacity:.9;line-height:1.25}
.bx-red{background:var(--red6);color:#fff}
.bx-white{background:#fff;color:var(--red)}
.bx-white .tl small{color:var(--muted)}
.rib{position:absolute;inset:0;z-index:1;pointer-events:none}
.rib::before,.rib::after{content:"";position:absolute;background:#fff}
.bx-white .rib::before,.bx-white .rib::after{background:var(--red)}
.rib::before{left:var(--rx,72%);top:0;bottom:0;width:12px;transform:translateX(-50%)}
.rib::after{top:var(--ry,34%);left:0;right:0;height:12px;transform:translateY(-50%)}
.tile .bow{position:absolute;width:56px;left:var(--rx,72%);top:var(--ry,34%);transform:translate(-50%,-62%);z-index:2;transition:transform .42s cubic-bezier(.3,1.5,.5,1),opacity .35s}
.bx-stripe{background:repeating-linear-gradient(135deg,var(--red6) 0 20px,#fff 20px 32px)}
.bx-stripe .lab{position:absolute;left:10px;right:10px;bottom:10px;background:var(--red);border-radius:12px;padding:10px 12px;z-index:3;color:#fff;display:grid;gap:2px}
.bx-stripe .lab b{font-size:17px;font-weight:500;line-height:1.1}.bx-stripe .lab small{font-size:12px;opacity:.9}
.bx-stripe .bow{left:74%;top:16%}
.t-ai{background:#fff;color:var(--ink)}
.t-ai .shots{position:absolute;right:14px;top:16px;bottom:16px;width:52%;z-index:2}
.t-ai .shots img{position:absolute;width:74%;aspect-ratio:1;object-fit:cover;border:5px solid #fff;box-shadow:0 8px 18px rgba(60,0,6,.3)}
.t-ai .shots img:nth-child(1){right:0;top:0;transform:rotate(5deg)}
.t-ai .shots img:nth-child(2){left:0;top:28%;transform:rotate(-6deg)}
.t-ai .shots img:nth-child(3){right:6%;bottom:0;transform:rotate(3deg)}
.t-ai .tl{left:16px;right:56%;bottom:16px;top:16px;align-content:space-between}
.t-ai .tl b{font-family:var(--display);font-weight:400;font-size:38px;line-height:.92;color:var(--red)}
.t-ai .tl small{font-size:13px;color:var(--muted);opacity:1}
.t-ai .go{display:inline-flex;align-items:center;gap:6px;justify-self:start;background:var(--red);color:#fff;border-radius:999px;padding:9px 14px;font-weight:500;font-size:14px}
.t-vote{background:var(--red8);color:#fff}
.t-vote img{position:absolute;right:0;top:0;height:100%;width:46%;object-fit:cover;object-position:50% 25%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.t-vote .tl{right:46%;top:12px;bottom:12px;align-content:center}
.t-bay{background:radial-gradient(circle at 80% 30%,#f2434e,#a90f1a)}
.t-bay .kvb{position:absolute;right:-16%;bottom:-20%;width:76%}
.t-bay .tl{bottom:auto;top:12px}.t-bay .tl img{width:96px}
.tile.pop{animation:tilePop .43s ease-in forwards}
.tile.pop .bow{transform:translate(-50%,-180%) rotate(-25deg) scale(1.1);opacity:0}
@keyframes tilePop{40%{transform:scale(.95)}100%{transform:scale(1.03);filter:brightness(1.15)}}

/* concept 2: clean landing */
.land .head{display:flex;justify-content:space-between;align-items:center}
.land .head .lk{display:grid;gap:0;line-height:1}
.land .head .lk img{width:118px;filter:brightness(0) saturate(100%) invert(18%) sepia(94%) saturate(4800%) hue-rotate(350deg) brightness(92%)}
.land .head .lk span{font-family:var(--display);font-size:22px;color:var(--ink)}
.aic{grid-template-columns:1fr;gap:12px}
.aic .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.aic .shots button{border:0;padding:0;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:1}
.aic .shots img{width:100%;height:100%;object-fit:cover}
.aic .shots span{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);color:var(--ink);font-size:11px;font-weight:500;border-radius:999px;padding:2px 8px}
.secth{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 0}
.secth h3{margin:0;font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.secth span{font-size:13px;color:var(--muted)}
.list{background:#fff;border-radius:16px;box-shadow:var(--sh-card);overflow:hidden}
.acc{border-bottom:1px solid var(--g1)}
.acc:last-child{border-bottom:0}
.acch{width:100%;border:0;background:none;display:grid;grid-template-columns:48px 1fr auto 18px;gap:12px;align-items:center;padding:11px 14px;text-align:left;color:var(--ink)}
.dt{text-align:center;background:var(--g1);border-radius:10px;padding:5px 0;line-height:1;color:var(--ink)}
.dt b{display:block;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}.dt small{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.acc.open .dt,.acc.tash .dt{background:var(--red);color:#fff}.acc.open .dt small,.acc.tash .dt small{color:#fff}
.acch .nm b{display:block;font-size:15px;font-weight:500}.acch .nm small{font-size:12.5px;color:var(--muted);display:block;line-height:1.3}
.acch .cv{width:18px;height:18px;color:var(--muted);transition:transform .25s var(--ease)}
.acc.open .acch .cv{transform:rotate(180deg)}
.accp{padding:0 14px 14px 74px;display:grid;gap:10px;animation:accIn .3s var(--ease)}
@keyframes accIn{from{opacity:0;transform:translateY(-6px)}}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.days button{border:0;border-radius:10px;background:var(--g1);padding:6px 0;display:grid;justify-items:center;line-height:1.1;font-weight:500;font-size:16px;position:relative;color:var(--ink)}
.days button small{font-size:9.5px;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--red);color:#fff}.days button[aria-pressed="true"] small{color:#fff}
.days button .ld{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--red);animation:pulse 1.2s infinite}
.tline{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tline li{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:13.5px;padding:5px 0;position:relative}
.tline li b{font-weight:500;font-variant-numeric:tabular-nums}
.tline li.main{color:var(--red)}
.note2{display:flex;gap:8px;align-items:center;background:#fde8e9;color:var(--red8);border-radius:12px;padding:8px 10px;font-size:13px}
.note2 svg{width:18px;height:18px;flex:none}
.pl{font-size:14px;display:flex;gap:6px;align-items:flex-start}
.pl svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--red)}
.feat{border:0;padding:0;background:#fff;border-radius:16px;box-shadow:var(--sh-card);overflow:hidden;display:grid;text-align:left;color:var(--ink)}
.feat img{width:100%;aspect-ratio:16/8;object-fit:cover}
.feat .tx{padding:14px 16px 16px;display:grid;gap:6px}
.feat .tx b{font-size:17px;font-weight:500;line-height:1.2}
.feat .tx span{font-size:13.5px;color:var(--muted)}
.guest{grid-template-columns:84px 1fr;align-items:center;gap:14px}
.guest img{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:50% 20%}
.guest b{font-size:17px;font-weight:500;display:block}
.vrow{display:grid;grid-template-columns:88px 1fr 40px;gap:8px;align-items:center;font-size:13.5px}
.vbar{height:6px;border-radius:3px;background:var(--g1);overflow:hidden}
.vbar i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .6s var(--ease)}
.vrow b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}

/* route + city */
.uzmap{position:relative;aspect-ratio:900/608;background:var(--red);border-radius:16px;overflow:hidden;box-shadow:var(--sh-card)}
.uzmap>img{position:absolute;inset:6%;width:88%;height:88%;opacity:.2;filter:brightness(10)}
.uzmap svg{position:absolute;inset:6%;width:88%;height:88%;overflow:visible}
.uzmap .tag{position:absolute;left:12px;top:10px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:#fff}
.cityban{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/9;color:#fff}
.cityban img{width:100%;height:100%;object-fit:cover}
.cityban .ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(166,16,25,.94),rgba(166,16,25,.5) 52%,transparent 80%);display:grid;align-content:end;padding:16px;gap:2px}
.cityban .ov b{font-family:var(--display);font-weight:400;font-size:40px;line-height:.9}
.cityban .ov small{font-size:13px}
.aimini{border:0;background:var(--red);color:#fff;border-radius:16px;padding:10px;display:grid;grid-template-columns:64px 1fr 18px;gap:12px;align-items:center;text-align:left}
.aimini img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid #fff}
.aimini b{display:block;font-size:15px;font-weight:500}.aimini small{font-size:12.5px;opacity:.92;display:block;line-height:1.3}
.aimini svg{width:18px;height:18px}
.livemap{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:360/250;box-shadow:var(--sh-card)}
.livemap svg{width:100%;height:100%;display:block}
.livemap .chip{position:absolute;left:10px;top:10px}
.nownext{display:grid;gap:8px}
.nownext .r{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.nownext .r small{color:var(--muted);font-size:12px}
.nownext .dot{width:12px;height:12px;border-radius:50%;justify-self:center}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.cnt span{background:var(--g1);color:var(--red);border-radius:12px;padding:7px 0 5px;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.05}
.cnt small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:var(--g1);border-radius:12px;padding:10px 12px;text-align:left;font-size:13.5px;width:100%;color:var(--ink)}
.sw .t{width:42px;height:24px;border-radius:999px;background:var(--g2);position:relative;flex:none;transition:background .2s}
.sw .t::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.sw[aria-checked="true"] .t{background:var(--red)}.sw[aria-checked="true"] .t::after{transform:translateX(18px)}

/* party bus */
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.gal::-webkit-scrollbar{display:none}
.gal figure{margin:0;flex:0 0 84%;scroll-snap-align:center;border-radius:16px;overflow:hidden;position:relative}
.gal img{width:100%;aspect-ratio:16/10;object-fit:cover}
.gal figcaption{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.92);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}
.floors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.floors .card{padding:12px;gap:4px;align-content:start}
.floors b{font-size:14.5px;font-weight:500}.floors span{font-size:12.5px;color:var(--muted);line-height:1.35}
.floors .lbl{color:var(--red)}
.pick6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.pick6 button,.slots button{border:1.5px solid var(--g2);background:#fff;border-radius:12px;padding:6px 0;display:grid;justify-items:center;color:var(--ink);font-weight:500;font-size:16px;line-height:1.15}
.pick6 button small,.slots button small{font-size:10px;color:var(--muted)}
.pick6 button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}.pick6 button[aria-pressed="true"] small{color:#fff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slots button[aria-pressed="true"]{border-color:var(--red);color:var(--red);box-shadow:0 0 0 2px rgba(228,30,43,.15)}
.slots button[disabled]{opacity:.45;pointer-events:none}
.ticket{background:#fff;border-radius:20px;overflow:hidden;display:grid;box-shadow:var(--sh-card)}
.ticket .tp{background:var(--red);color:#fff;padding:16px;display:grid;gap:2px;position:relative}
.ticket .tp b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.ticket .tp::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:16px;background:radial-gradient(circle at 8px 8px,transparent 7px,#fff 7.5px) -8px 0/16px 16px repeat-x}
.ticket .bd{padding:18px 14px 14px;display:grid;gap:10px;justify-items:center;text-align:center}
.qr{width:150px;height:150px}

/* vote */
.ghero{position:relative;border-radius:16px;overflow:hidden;background:var(--red8);color:#fff;display:grid;grid-template-columns:1fr 46%;min-height:170px}
.ghero img{height:100%;width:100%;object-fit:cover;object-position:50% 20%;grid-column:2;grid-row:1}
.ghero .tx{grid-column:1;grid-row:1;padding:16px;display:grid;align-content:end;gap:4px;position:relative;z-index:1}
.ghero .tx b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.ghero .tx small{font-size:12.5px;opacity:.92}
.cvl{display:grid;gap:0}
.cvr{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--g1)}
.cvr:last-child{border-bottom:0}
.cvr .pn{font-weight:500;color:var(--muted);text-align:center}
.cvr b{font-size:15px;font-weight:500;display:block}.cvr small{font-size:12px;color:var(--muted);display:block}
.cvr .vbar{margin-top:5px}
.cvr.mine{background:#fde8e9}
.vb{border:0;background:var(--red);color:#fff;border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px}
.pc{font-weight:500;font-variant-numeric:tabular-nums}

/* AI frame */
.scn{display:grid;gap:10px}
.scn>button{border:2px solid transparent;border-radius:16px;padding:0;background:#fff;box-shadow:var(--sh-card);display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;text-align:left;overflow:hidden;color:var(--ink)}
.scn>button img{width:96px;height:96px;object-fit:cover}
.scn>button b{display:block;font-size:16px;font-weight:500}.scn>button small{font-size:12.5px;color:var(--muted)}
.scn>button[aria-pressed="true"]{border-color:var(--red)}
.cntp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cntp button{width:40px;height:36px;border-radius:999px;border:1.5px solid var(--g2);background:#fff;font-weight:500;color:var(--ink)}
.cntp button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.paybar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:var(--sh-card)}
.paybar b{display:flex;align-items:center;gap:5px;font-size:16px;font-weight:500}
.linkb{border:0;background:none;padding:6px 0;font-size:14px;font-weight:500;color:var(--red);justify-self:center}
/* gallery picker */
.gall{min-height:100%;background:#000;color:#fff;display:flex;flex-direction:column}
.gall .gh{position:sticky;top:0;z-index:2;background:rgba(18,18,18,.94);backdrop-filter:blur(10px);display:grid;grid-template-columns:80px 1fr 80px;align-items:center;padding:10px 12px}
.gall .gh button{border:0;background:none;color:#4ea3ff;font-size:15px;padding:0;text-align:left}
.gall .gh button:last-child{text-align:right;font-weight:600}
.gall .gh button[disabled]{color:#555}
.gall .gh b{text-align:center;font-size:15px;font-weight:600}
.gall .tabs{display:flex;gap:18px;justify-content:center;font-size:13px;color:#8e8e93;padding:2px 0 8px;background:rgba(18,18,18,.94)}
.gall .tabs span:first-child{color:#fff;font-weight:600}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.ggrid button{border:0;padding:0;position:relative;aspect-ratio:1;background:#222}
.ggrid img{width:100%;height:100%;object-fit:cover}
.ggrid .n{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.25);font-size:13px;font-weight:600;display:grid;place-items:center}
.ggrid button[aria-pressed="true"] .n{background:var(--red)}
.ggrid button[aria-pressed="true"] img{opacity:.75}
.gall .gf{margin-top:auto;position:sticky;bottom:0;background:rgba(18,18,18,.94);padding:10px 14px 14px;font-size:13px;color:#d8d8dc;text-align:center}
/* consent 2 sheet + generation */
.thumbs{display:flex;gap:6px;justify-content:center}
.thumbs img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.gen{display:grid;justify-items:center;gap:18px;padding:30px 0;text-align:center}
.genbox{width:280px;aspect-ratio:1;position:relative;border-radius:6px;overflow:hidden;background:var(--red);border:10px solid #fff;box-shadow:var(--sh-card)}
.genbox .fs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n,1),1fr)}
.genbox .fs img{width:100%;height:100%;object-fit:cover;filter:blur(3px) saturate(.8);opacity:.85}
.genbox::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.65) 50%,transparent 70%);animation:shim 1.1s linear infinite}
@keyframes shim{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.gst{display:grid;gap:8px;text-align:left;width:240px}
.gst div{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted);transition:color .3s}
.gst div i{width:22px;height:22px;border-radius:50%;border:2px solid var(--g2);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;transition:all .3s}
.gst div.on{color:var(--ink)}.gst div.on i{border-color:var(--red);border-top-color:transparent;animation:spin .8s linear infinite}
.gst div.ok{color:var(--ink)}.gst div.ok i{background:var(--red);border-color:var(--red);animation:none}
.gst div.ok i::after{content:"✓"}
.seg{display:flex;background:#fff;border-radius:999px;padding:3px;box-shadow:var(--sh-card)}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 0;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.resv{justify-self:center;position:relative}
.resv img{display:block;box-shadow:0 14px 34px rgba(80,0,8,.25)}
.resv .sto{width:226px;aspect-ratio:9/16;border-radius:16px}
.resv .sq{width:300px;aspect-ratio:1;border-radius:4px}
.resv .tagx{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;border-radius:6px;padding:2px 8px}
.row2b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perk{display:flex;gap:12px;align-items:center;font-size:14px;line-height:1.35}
.perk .ic{width:36px;height:36px;border-radius:50%;background:#fde8e9;color:var(--red);display:grid;place-items:center;flex:none}
.perk .ic svg{width:18px;height:18px}
.perk code{font:500 15px ui-monospace,Menlo,monospace;color:var(--red);letter-spacing:.06em}
.mst{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.mst i{width:8px;height:8px;border-radius:50%;background:#e3a400;flex:none}
.mst.y i{background:var(--ok)}.mst.air i{background:var(--red);animation:pulse 1s infinite}.mst.n i{background:var(--muted)}

/* sheet */
.sheet{position:absolute;inset:0;background:rgba(26,26,26,0);display:flex;align-items:flex-end;z-index:7;transition:background .25s;pointer-events:none}
.sheet.on{background:rgba(26,26,26,.5);pointer-events:auto}
.sheet .in{background:#fff;color:var(--ink);border-radius:24px 24px 0 0;padding:10px 16px 24px;width:100%;display:grid;gap:12px;transform:translateY(100%);transition:transform .38s var(--sheet)}
.sheet.on .in{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--g2);justify-self:center}
.sheet h4{margin:0;font-size:19px;font-weight:500;text-align:center}
.kvr{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--g1);padding:8px 0}
.kvr b{display:flex;align-items:center;gap:5px;font-weight:500}
.sheet .chk{background:var(--g1)}

/* ---------- desk ---------- */
.desk{display:grid;gap:16px;min-width:0}
.panel{background:var(--desk);border:1px solid var(--deskline);border-radius:18px;padding:16px;display:grid;gap:12px;align-content:start}
.panel h2{margin:0;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dmuted);font-weight:600}
.cons2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.cons2{grid-template-columns:1fr}}
.con{border:1px solid var(--deskline);background:transparent;border-radius:14px;padding:12px;text-align:left;display:grid;gap:5px;align-content:start}
.con b{font-size:15px}.con span{font-size:12.5px;color:var(--dmuted);line-height:1.4}
.con[aria-pressed="true"]{background:var(--dtext);color:var(--stage);border-color:var(--dtext)}
.con[aria-pressed="true"] span{color:#5b3a3e}
.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;counter-reset:f;margin:0;padding:0;list-style:none}
.flow li{counter-increment:f}
.flow button{width:100%;height:100%;display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start;text-align:left;border:1px solid var(--deskline);background:transparent;border-radius:12px;padding:9px 10px;transition:background .15s}
.flow button::before{content:counter(f);width:24px;height:24px;border-radius:50%;background:var(--deskline);display:grid;place-items:center;font-size:12px;font-weight:700}
.flow button b{display:block;font-size:13.5px}
.flow button span{font-size:12px;color:var(--dmuted);line-height:1.35;display:block}
.flow button[aria-current="step"]{background:var(--dtext);color:var(--stage);border-color:var(--dtext)}
.flow button[aria-current="step"]::before{background:var(--red);color:#fff}
.flow button[aria-current="step"] span{color:#5b3a3e}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--deskline);background:transparent;border-radius:999px;padding:8px 13px;font-size:13.5px}
.opt[aria-pressed="true"]{background:var(--dtext);color:var(--stage);border-color:var(--dtext)}

function cityState(c){

  if(c.days){ const td=s.find(x=>isToday(x[2].d)&&n<x[0]); if(td) return {k:"today",slot:td}; }
  const next=s.find(x=>n<x[0]); if(next) return {k:"soon",slot:next};
  return {k:"done",slot:s[s.length-1]};
}

function streetMap(c,slot){
  const r=mulberry(hash(c.id+slot[2].d)); const W=360,H=250;
  const cols=[...Array(10)].map((_,i)=>-20+i*44+r()*14), rows=[...Array(8)].map((_,j)=>-10+j*40+r()*12);
  let g="";
  rows.forEach((y,j)=>{ g+=`<path d="M-40 ${y} L${W+40} ${y+(r()*20-10)}" stroke="${j%3?"#e8e4e4":"#fff"}" stroke-width="${j%3?2:6}" fill="none"/>`; });
  cols.forEach((x,i)=>{ g+=`<path d="M${x} -40 L${x+(r()*24-12)} ${H+40}" stroke="${i%3?"#e8e4e4":"#fff"}" stroke-width="${i%3?2:6}" fill="none"/>`; });
  const parks=[...Array(3)].map(()=>`<rect x="${(r()*300).toFixed(0)}" y="${(r()*200).toFixed(0)}" width="${(36+r()*40).toFixed(0)}" height="${(26+r()*30).toFixed(0)}" rx="8" fill="#dfeedd"/>`).join("");

  const pts=[]; let ci=1,rj=2+Math.floor(r()*3); const P=(i,j)=>[cols[i],rows[j]]; pts.push(P(ci,rj));
  while(ci<8){ ci++; pts.push(P(ci,rj)); if(r()<.55){ rj=Math.max(1,Math.min(6,rj+(r()<.5?-1:1))); pts.push(P(ci,rj)); } }
  const d="M"+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
  const stops=["Выезд колонны",slot[2].p,"Парк"]; const idx=[0,Math.round((pts.length-1)*.55),pts.length-1];
  const pins=idx.map((pi,i)=>`<g transform="translate(${pts[pi][0]},${pts[pi][1]})"><circle r="${i===1?12:9}" fill="${i===1?"#e41e2b":"#fff"}" stroke="#e41e2b" stroke-width="3"/><text y="4" text-anchor="middle" font-size="11" font-weight="700" fill="${i===1?"#fff":"#e41e2b"}" font-family="TCCC Unity,system-ui">${i+1}</text></g>`).join("");
  const truck=`<g id="truckMk"><circle r="17" fill="#e41e2b" opacity=".25"><animate attributeName="r" values="12;20;12" dur="1.4s" repeatCount="indefinite"/></circle><circle r="12" fill="#e41e2b" stroke="#fff" stroke-width="3"/><path d="M-7 -3h8v7h-8zM1 -1h3l3 3v2H1z" fill="#fff"/></g>`;
  return {svg:`<svg viewBox="0 0 ${W} ${H}" aria-label="Карта: маршрут каравана"><rect width="${W}" height="${H}" fill="#f4f1ee"/>${parks}${river}${g}

    <path id="rDone" d="${d}" fill="none" stroke="#e41e2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>${pins}${truck}</svg>`,pts,idx,stops};
}
let raf=null;
function animateTruck(m){
  cancelAnimationFrame(raf);
  const base=$("#rDone"), mk=$("#truckMk"); if(!base) return;
  const L=base.getTotalLength(); const pts=m.pts; let acc=[0]; for(let i=1;i<pts.length;i++) acc.push(acc[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const fr=acc.map(a=>a/acc[acc.length-1]); const stopFr=m.idx.map(i=>fr[i]);
  const p0=Math.min(.9,Math.max(.04,(now()-m.slot[0])/(m.slot[1]-m.slot[0]))); const s0=performance.now();
  const step=()=>{ if(!document.body.contains(base)) return;
    let p=Math.min(.98,p0+((performance.now()-s0)/1000)*.01);
    base.style.strokeDasharray=`${L*p} ${L}`; const q=base.getPointAtLength(L*p); mk&&mk.setAttribute("transform",`translate(${q.x},${q.y})`);
    const nx=stopFr.findIndex(f=>f>p); const prev=nx===-1?2:nx-1; const el=$("#nowTxt");
    if(el){ el.innerHTML=nx===-1?`Колонна в парке`:`Едет от «${m.stops[prev]}» к «${m.stops[nx]}»`;
      $("#nextTxt").textContent=nx===-1?"финиш":m.stops[nx];
      const mins=nx===-1?0:Math.max(1,Math.round((stopFr[nx]-p)*(m.slot[1]-m.slot[0])/6e4)); $("#etaTxt").textContent=nx===-1?"":`через ${mins} мин`; }
    raf=requestAnimationFrame(step); };
  step();
}

function qrSVG(seed){
  const r=mulberry(hash(seed)); const N=25; let cells="";
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#1a1a1a"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#1a1a1a"/>`;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16)) continue; if(r()<.48) cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg class="qr" viewBox="-1 -1 27 27" aria-label="QR-код"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/><g fill="#1a1a1a">${cells}</g>${finder(0,0)}${finder(18,0)}${finder(0,18)}</svg>`;
}

const c3pos=i=>`translateX(calc(13% - ${i} * (74% + 12px)))`;
function setPv(i,anim=true){
  const S=PS[st.ps]; i=Math.max(0,Math.min(S.cards.length-1,i)); const ch=i!==st.pv; st.pv=i; if(ch) st.sel=[];
  const t=$("#c3t"); if(t){ t.classList.toggle("drag",!anim); t.style.transform=c3pos(i); }
  $$("#cards3 [data-pcv], #c3dots [data-pcv]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.pcv===i));
  const pb=$("#pickBtn"); if(pb) pb.textContent="Выбрать "+ppl(curCard().n);
  if(ch) try{ tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged(); }catch(_){}

(()=>{ let g=null;
  const down=e=>{ const t=e.target.closest&&e.target.closest("#c3t"); if(!t||(e.button!=null&&e.button>0)) return;
    g={id:e.pointerId,x:e.clientX,y:e.clientY,ax:null,W:$("#cards3").clientWidth,t}; };
  const move=e=>{ if(!g||e.pointerId!==g.id) return; const dx=e.clientX-g.x, dy=e.clientY-g.y;
    if(!g.ax){ if(Math.abs(dx)<7&&Math.abs(dy)<7) return; g.ax=Math.abs(dx)>Math.abs(dy)?"x":"y"; if(g.ax==="x"){ try{g.t.setPointerCapture(g.id)}catch(_){} g.t.classList.add("drag"); } }
    if(g.ax!=="x") return; e.preventDefault();
    const n=PS[st.ps].cards.length, edge=(st.pv===0&&dx>0)||(st.pv===n-1&&dx<0);
    g.t.style.transform=`translateX(calc(13% - ${st.pv} * (74% + 12px) + ${edge?dx*.35:dx}px))`; g.dx=dx; };
  const up=e=>{ if(!g||e.pointerId!==g.id) return; const w=g; g=null; if(w.ax!=="x") return;
    w.t.classList.remove("drag"); const step=w.W*.74+12, dx=w.dx||0;
    let k=Math.round(-dx/step); if(k===0&&Math.abs(dx)>40) k=dx<0?1:-1;
    w.t._swiped=Date.now(); setPv(st.pv+k); };
  mini.addEventListener("pointerdown",down,{passive:true});
  mini.addEventListener("pointermove",move,{passive:false});
  mini.addEventListener("pointerup",up); mini.addEventListener("pointercancel",e=>{ if(g&&e.pointerId===g.id){ const w=g; g=null; if(w.ax==="x"){ w.t.classList.remove("drag"); setPv(st.pv); } } });
})();

      ${st.ex?`<div class="card"><span class="sub">Это пример на демо-фото. Создайте открытку со своими фото, чтобы получить промокод.</span><button class="btn r" data-pstep="pick">Создать свою</button></div>`:

        <div class="perk"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg></span><span>Открытка может появиться на экранах трака<br><span class="mst ${m?m.status:"q"}" id="mineSt"><i></i>${stLabel(m)}</span></span></div>

    <div class="pscn">${PS.map((x,i)=>`<button data-ps="${i}"><span class="pfan">${[1,2,0].map(j=>`<img src="img/pc-${x.cards[j].k}-${st.lang}.webp" alt="">`).join("")}</span><span><b>${x.n}</b><small>3 открытки · ${x.cards.map(c=>c.n).filter((v,j,a)=>a.indexOf(v)===j).sort().join(" или ")} чел.</small></span>${chev}</button>`).join("")}</div>

function stepGen(mode,done){
  st.ai=mode; render(); let i=0;
  const iv=setInterval(()=>{ const g=$$("#gst div"); if(g[i]){ g[i].classList.remove("on"); g[i].classList.add("ok"); } i++; if(g[i]) g[i].classList.add("on");
    if(i>=3){ clearInterval(iv); setTimeout(()=>{ if(st.screen==="ai"&&st.ai===mode) done(); },450); } },1000);
}

  else if(d.pg!=null){ const i=+d.pg, need=curCard().n, k=st.sel.indexOf(i);

  else if(d.lang){ st.lang=d.lang; render(false); }
  else if(d.anim!=null){ stepGen("anim",()=>{ st.animated=true; st.ai="done"; hapt("success"); render(false); }); }
  else hit=false;
  if(hit) e.stopImmediatePropagation();
},true);

  window.addEventListener("message",e=>{ const m=e.data||{};

      if(f==="ai") st.ai="scene";
      if(f==="route") st.open=null;
      go(f); }
  });
}
